name: Daily news (Priority A)

# Phase D — daily cadence. Polls modules 05/06/11 on Priority A accounts only
# (~10-15 accounts, ~$0.13/account/day projected = ~$20-40/month). News and
# trigger events have the shortest sales-relevance window — daily catches
# bankruptcy / layoffs / funding / agency-switch / Tier-1 senior hire within
# ~24h of breaking publicly. Every run bumps Last Researched.

on:
  schedule:
    # 18:00 Europe/Belgrade (end-of-day). UTC+2 (CEST, late Mar–late Oct)
    # → 16:00 UTC. During winter UTC+1 (CET) this fires at 17:00 local —
    # fine for a daily news poll; tighten only if hour-precise delivery
    # becomes important.
    - cron: '0 16 * * *'
  workflow_dispatch:  # allow manual `gh workflow run` for ad-hoc runs

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
      LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily news poll
        run: |
          python account_research_agent.py \
            --priority "Priority A" \
            --tasks module_01_gate,research_pass,module_05_structural_news,module_06_trigger_events,module_11_hiring_signal \
            --module-since "module_05_structural_news:1,module_06_trigger_events:1,module_11_hiring_signal:1" \
            --cost-summary
